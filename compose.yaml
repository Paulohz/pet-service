services:
  postgres:
    image: postgres:16-alpine
    container_name: petdb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - petdb_data:/var/lib/postgresql/data

volumes:
  petdb_data: