spring:
  application:
    name: pet-service
  datasource:
    url: jdbc:postgresql://localhost:5432/petdb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
  docker:
    compose:
      enabled: true

server:
  port: 8080